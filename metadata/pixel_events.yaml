table_id: pixel_events
display_name: Ad Tracking Pixel Events
description: >
  Event-level stream of ad tracking signals (impressions, clicks, video engagement
  milestones) captured via tracking pixels across digital channels. Partitioned by
  event date. Supports all awareness, engagement, and conversion funnel metrics.
  cookie_id is absent for ~18% of events to model ITP / cookieless environments.
  spend_usd is the pro-rated CPM cost for impression events; zero for other event types.

tags:
  business_owner: Marketing Data Products
  data_domain: activation
  pii_class: pseudonymous
  refresh_cadence: daily
  row_count_approx: 2000000
  marketing_usecases: post_campaign_analysis,content_performance_prediction,audience_performance_prediction

columns:
  - name: event_id
    description: Primary key (UUID v4) for each individual tracking event.
  - name: event_type
    description: "\"Controlled vocab: impression | click | video_start | video_q1 | video_q2 | video_q3 | video_complete | engagement.\""
  - name: cookie_id
    description: FK to cookie_registry. ~82% populated. Join to cookie_registry for audience enrichment.
  - name: campaign_id
    description: FK to campaigns.campaign_id. Always populated.
  - name: creative_id
    description: FK to creatives.creative_id. Always populated.
  - name: channel
    description: Channel where the event occurred (meta, youtube, tiktok, display, ctv, search).
  - name: placement
    description: Ad placement / format hint (feed, sidebar, pre-roll, mid-roll, search_results).
  - name: country_code
    description: ISO 3166-1 alpha-2 geo of the event.
  - name: region
    description: Sub-national administrative region.
  - name: lat
    description: Event latitude. ~50% populated.
  - name: lon
    description: Event longitude. ~50% populated.
  - name: device_type
    description: "Device category: desktop | mobile | tablet | ctv."
  - name: spend_usd
    description: Media cost attributed to this event. SUM / impressions * 1000 = CPM.
  - name: event_ts
    description: Timestamp when the event occurred.
  - name: event_date
    description: Date of the event (derived from event_ts).
  - name: partition_date
    description: Iceberg partition key (day). Always filter on this column for time-range queries.

data_quality_rules:
  - column: event_id
    rule_type: non_null
  - column: campaign_id
    rule_type: non_null
  - column: creative_id
    rule_type: non_null
  - column: cookie_id
    rule_type: non_null
    threshold: 0.79
