table_id: campaigns
display_name: Campaign / Flight Metadata
description: >
  Master record for advertising campaigns. Contains two semantically equivalent
  columns — brand and advertiser — with identical values, intentionally to showcase
  Dataplex synonym detection. Channels and regions are arrays to support multi-market,
  multi-channel flights.

tags:
  business_owner: Marketing Data Products
  data_domain: campaigns
  pii_class: none
  refresh_cadence: daily
  row_count_approx: 200
  marketing_usecases: post_campaign_analysis,audience_discovery

columns:
  - name: campaign_id
    description: Primary key (UUID v4). Used as FK in pixel_events and creatives.
  - name: campaign_name
    description: Human-readable campaign name combining brand, product category and sequence.
  - name: brand
    description: "Advertiser brand name. Synonym: advertiser (same table). Glossary term: Brand / Advertiser."
  - name: advertiser
    description: Semantic duplicate of brand. Identical value. Present for synonym resolution demo.
    synonym_of: brand
  - name: product_category
    description: IAB product category for the campaign (e.g. Apparel, Beauty, CPG, Tech).
  - name: country_code
    description: ISO 3166-1 alpha-2 code for the primary market.
  - name: regions
    description: Target regions within the market (array of administrative units).
  - name: channels
    description: Activated channels for this campaign (meta, youtube, tiktok, display, ctv, search).
  - name: objective
    description: "Campaign goal: awareness | consideration | conversion | retention."
  - name: budget_usd
    description: Total approved budget in US dollars.
  - name: actual_spend_usd
    description: Realised spend. May differ from budget_usd. Use for ROAS and CPA calculations.
  - name: start_date
    description: Flight start date.
  - name: end_date
    description: Flight end date.
  - name: status
    description: "Lifecycle state: planned | active | completed | paused."
  - name: created_at
    description: Record creation timestamp.

data_quality_rules:
  - column: campaign_id
    rule_type: non_null
  - column: brand
    rule_type: non_null
  - column: advertiser
    rule_type: non_null
  - column: status
    rule_type: set
    values: [planned, active, completed, paused]
