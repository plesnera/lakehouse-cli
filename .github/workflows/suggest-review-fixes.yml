# ======================================================================================
# Workflow: Suggest Review Fixes
# ======================================================================================
# Usage:
#   - Triggers when a Pull Request Review is submitted.
#   - Reads the review comments and uses the Oz Agent to suggest fixes.
#
# Setup:
#   - Ensure WARP_API_KEY is set in Repository Secrets.
#
# Expected Output:
#   - Inline replies to review comments with code suggestions where applicable.
#
# When to use:
#   - Use this to automatically address simple review comments.
# ======================================================================================
name: Suggest Review Fixes
on:
  pull_request_review:
    types: [submitted]

jobs:
  suggest_review_fixes:
    runs-on: ubuntu-latest
    if: contains(github.event.review.body, '@oz-agent') &&
        github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch review comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const reviewId = context.payload.review.id;
            const prNumber = context.payload.pull_request.number;
            const reviewBody = context.payload.review.body;

            core.info(`Fetching comments for review ${reviewId} on PR #${prNumber}`);

            const { data: comments } = await github.rest.pulls.listCommentsForReview({
              owner, repo,
              pull_number: prNumber,
              review_id: reviewId
            });

            // listCommentsForReview only returns inline comments (on specific diff lines).
            // If the review has a body but no inline comments, include the body so the
            // Oz Agent has something to respond to.
            if (comments.length === 0 && reviewBody && reviewBody.trim()) {
              core.info('No inline comments found; using review body as a synthetic comment.');
              comments.push({
                id: String(reviewId),
                path: null,
                line: null,
                start_line: null,
                body: reviewBody,
                diff_hunk: null
              });
            }

            core.info(`Found ${comments.length} comments.`);
            fs.writeFileSync( 'review_comments.json', JSON.stringify(comments, ['id', 'path', 'line', 'start_line', 'body', 'diff_hunk'], 2));

      - name: Construct Prompt
        id: prompt
        uses: actions/github-script@v7
        with:
          script: |
            const prompt = `You have review comments in review_comments.json. Your task is to generate responses.json containing code suggestions.

            IMPORTANT CONSTRAINTS:
            - Do NOT run any git commands (no commits, branches, or pushes)
            - Do NOT modify any source files directly
            - ONLY create the responses.json file

            FOR EACH COMMENT:
            1. Read the comment body and diff_hunk.
            2. If diff_hunk is NOT null, this is an inline comment. Decide if it's a simple fix:
               Simple fixes:
               - Typo corrections
               - Variable/function renames
               - Adding/removing a single line
               - Simple style changes (formatting, spacing)
               - Reverting a small change (when diff_hunk shows the original)

               NOT simple (skip these):
               - Involves updating lines beyond this diff hunk
               - Needs architectural decisions
               - Involves multiple files
               - Comment is a question or discussion (not a change request)
               - Comment is praise or approval (e.g., "LGTM", "nice!")

            3. If diff_hunk IS null, this is a review body (general request, not line-specific).
               Treat it as a task request: analyze the codebase, investigate the issue raised,
               and provide your findings and recommendations as a text response.

            HOW SUGGESTIONS WORK (for inline comments with diff_hunk):
            The suggestion block will COMPLETELY REPLACE the lines shown in the diff_hunk.
            - Your suggestion ENTIRELY OVERWRITES the diff_hunk content
            - Include ALL lines you want to keep from the diff_hunk, with your changes applied
            - Any lines from the diff_hunk not in your suggestion will be DELETED
            - You cannot add lines outside the diff_hunk scope
            - PRESERVE EXACT INDENTATION: match the original whitespace (spaces/tabs) exactly
            - Do not change formatting, line breaks, or whitespace unless that's the requested fix

            OUTPUT FORMAT:
            Create responses.json as a valid JSON object. Each key is a comment ID.

            For inline comments (diff_hunk not null), each value is a string containing:
            - A brief explanation (1 sentence max)
            - A newline
            - A suggestion block:
            \`\`\`suggestion
            <complete replacement for the diff_hunk lines>
            \`\`\`

            For review body comments (diff_hunk is null), each value is a string containing:
            - A markdown summary of your analysis and findings (no suggestion block)

            VALID JSON EXAMPLES:
            {
              "12345678": "Fixed the typo.\\n\`\`\`suggestion\\nprintln!(\\"Hello, world!\\\");\\n\`\`\`",
              "4395381115": "I analyzed the codebase. The issue is that..."
            }

            If no comments are actionable, output: {}
            `;
            core.setOutput('prompt', prompt);

      - name: Run Oz Agent
        uses: warpdotdev/oz-agent-action@v1
        with:
          warp_api_key: ${{ secrets.WARP_API_KEY }}
          profile: ${{ vars.WARP_AGENT_PROFILE }}
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: Validate responses.json
        run: |
          if [ -f responses.json ]; then
            python3 -c "import json; json.load(open('responses.json'))" || {
              echo "Invalid JSON in responses.json, replacing with empty object"
              echo "{}" > responses.json
            }
          fi

      - name: Reply to comments
        uses: actions/github-script@v7
        if: always() # Run even if the agent fails, to try and post what was drafted
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('responses.json')) {
              core.info('No responses.json found.');
              return;
            }

            let responses;
            try {
              responses = JSON.parse(fs.readFileSync('responses.json', 'utf8'));
            } catch (e) {
              core.error(`Failed to parse responses.json: ${e.message}`);
              core.info(`File contents: ${fs.readFileSync('responses.json', 'utf8').substring(0, 500)}`);
              return;
            }

            // Load the original comments to know which are inline vs. review body
            let comments = [];
            if (fs.existsSync('review_comments.json')) {
              try {
                comments = JSON.parse(fs.readFileSync('review_comments.json', 'utf8'));
              } catch (e) {
                core.warning(`Could not read review_comments.json: ${e.message}`);
              }
            }
            const commentMap = new Map(comments.map(c => [String(c.id), c]));

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            for (const [commentId, reply] of Object.entries(responses)) {
              if (typeof reply !== 'string' || !reply.trim()) {
                core.info(`Skipping comment ${commentId}: empty or not a string.`);
                continue;
              }

              const comment = commentMap.get(commentId);
              const isSynthetic = comment && comment.diff_hunk === null;

              if (isSynthetic) {
                // Review body comment — post as a regular PR comment
                core.info(`Posting PR comment for review body (id=${commentId})`);
                try {
                  await github.rest.issues.createComment({
                    owner, repo,
                    issue_number: prNumber,
                    body: reply
                  });
                } catch (error) {
                  core.error(`Failed to post PR comment for ${commentId}: ${error.message}`);
                }
              } else if (reply.includes('```suggestion')) {
                // Inline comment with a suggestion block
                core.info(`Replying to inline comment ${commentId}`);
                try {
                  await github.rest.pulls.createReplyForReviewComment({
                    owner, repo,
                    pull_number: prNumber,
                    comment_id: Number(commentId),
                    body: reply
                  });
                } catch (error) {
                  core.error(`Failed to reply to inline comment ${commentId}: ${error.message}`);
                }
              } else {
                core.info(`Skipping inline comment ${commentId}: no suggestion block.`);
              }
            }