[project]
name = "lakehouse-content"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "faker",
    "google-api-core",
    "google-auth",
    "google-cloud-bigquery",
    "google-cloud-dataplex",
    "google-cloud-storage",
    "numpy",
    "protobuf",
    "pyarrow",
    "pydantic>=2.0",
    "pyiceberg",
    "pyyaml",
    "requests",
    "typer",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "typer[testing]",
]

[project.scripts]
lakehouse = "ingestion.cli:app"
