[project]
name = "lake-cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "google-api-core",
    "google-auth",
    "google-cloud-bigquery",
    "google-cloud-dataplex",
    "google-cloud-storage",
    "protobuf",
    "pydantic>=2.0",
    "pyyaml",
    "requests",
    "typer",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "typer[testing]",
]

[project.scripts]
lake = "lake_cli.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["lake_cli*"]
exclude = ["dataform*", "metadata*", "tests*", "docs*"]
