[project]
name = "lakehouse-content"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "faker",
    "pyiceberg",
    "pyarrow",
    "pydantic>=2.0",
    "typer",
    "google-cloud-storage",
    "google-cloud-bigquery",
    "google-cloud-dataplex",
    "google-cloud-dataproc",
    "google-cloud-dataproc-spark-connect",
    "numpy",
    "sqlalchemy",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "typer[testing]",
]

[project.scripts]
lakehouse = "ingestion.cli:app"
